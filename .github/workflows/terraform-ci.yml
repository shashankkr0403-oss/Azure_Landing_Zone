name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply the Terraform plan to Azure
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.8.5
  TF_WORKING_DIR: environment/dev
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          quiet: true
          framework: terraform

      - name: TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --fail --no-update

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan.binary

      - name: Infracost breakdown
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh -s -- --path /usr/local/bin
          infracost breakdown --path .

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false tfplan.binary

      - name: Terratest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        working-directory: tests
        run: go test ./...
